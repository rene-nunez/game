; PlatformIO Project Configuration File

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
  -I include
  -D TFT_ESPI_USER_SETUP_PATH=\"tft.h\"

lib_deps =
  bblanchon/ArduinoJson@^7.4.3
  bodmer/TFT_eSPI@^2.5.43

[platformio]
default_envs = host

[env:host]
build_flags =
  ${env.build_flags}
  -D DEVICE_ROLE=ROLE_HOST

[env:client]
build_flags =
  ${env.build_flags}
  -D DEVICE_ROLE=ROLE_CLIENT